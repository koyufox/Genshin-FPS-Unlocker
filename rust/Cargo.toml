[package]
name = "genshin-unlock"
version = "0.2.2"
edition = "2021"
license = "GPL-3.0-only"

[lib]
crate-type = ["staticlib"]

[dependencies]
libc = "=0.2.189"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = "s"
lto = "thin"
codegen-units = 1
